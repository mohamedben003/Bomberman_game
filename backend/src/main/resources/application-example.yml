# Example configuration — no credentials are committed.
# Copy to application-local.yml, fill in your values and run with:
#   SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bomberman}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:4200}
